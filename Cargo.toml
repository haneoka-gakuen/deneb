[workspace]
members = [
  "crates/deneb-core",
  "crates/deneb-cli",
  "crates/deneb-plugin-api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/haneoka-gakuen/deneb"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
camino = { version = "1.2.2", features = ["serde1"] }
clap = { version = "4.5.54", features = ["derive"] }
hex = "0.4.3"
node-semver = "2.2.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
semver = "1.0.27"
sha2 = "0.11.0"
tempfile = "3.24.0"
thiserror = "2.0.18"
walkdir = "2.5.0"
wasmtime = { version = "36.0.13", default-features = false, features = [
  "component-model",
  "cranelift",
  "runtime",
  "std",
] }
wasmparser = "0.230.0"
wit-parser = { version = "0.230.0", default-features = false }
zip = { version = "7.1.0", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.dev]
debug = "line-tables-only"
