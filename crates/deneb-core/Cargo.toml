[package]
name = "haneoka-deneb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Deterministic build graph, validation, bundle, and platform providers for Vega projects"
readme = "README.md"
documentation = "https://docs.rs/haneoka-deneb-core"
keywords = ["visual-novel", "packaging", "game-engine", "build"]
categories = ["development-tools::build-utils", "game-development"]
include = [
  "src/**",
  "assets/**",
  "wit/**",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
]

